name: Sync dashboards

# The update button. Actions -> "Sync dashboards" -> "Run workflow" pulls the
# latest dashboard.html from each source repository, commits whatever changed,
# and dispatches the Pages deploy. To make it automatic instead, add a
# `schedule:` block here — the job is already idempotent.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch dashboards from source repositories
        run: sh scripts/sync-dashboards.sh

      - name: Commit and push if anything changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain public)" ]; then
            echo "Dashboards already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public
            git commit -m "Sync dashboards from source repositories"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with GITHUB_TOKEN does not fire other workflows' `on: push`,
      # so the deploy has to be dispatched explicitly.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
